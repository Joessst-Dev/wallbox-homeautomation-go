# evcc config for the wha stack: Sungrow SH8.0 RT + Easee Home + Renault Twingo.
# Copy to evcc.yaml and fill in CHANGE_ME values, then: docker compose up -d
# Validate standalone with: evcc -c evcc.yaml checkconfig
#
# Two things here are wha-specific:
#   1. the `mqtt:` block — so evcc publishes state to Mosquitto for wha to read.
#   2. loadpoint enable/disable delays — evcc keeps its OWN surplus gate: it
#      only enables once export reaches the loadpoint's minimum charge power
#      (minCurrent x voltage x phases), and its enable/disable delays run IN
#      PARALLEL with wha's start/stop dwells (defaults: enable 1m, disable 3m).
#      wha floors its startThresholdW
#      at that same minimum (control.minCurrentA / phases / startMarginW), so
#      the two gates agree. Keep a disable delay (~3m) for contactor safety.

# The Easee driver requires a sponsor token. Get one at https://sponsor.evcc.io
# (GitHub Sponsors) or use the time-limited trial token from
# https://docs.evcc.io/en/sponsorship (it currently expires 2026-11-23 — verify
# before relying on it).
# Treat it as a secret — do not commit your real token.
sponsortoken: CHANGE_ME

# Publish/subscribe to the shared broker. wha connects to the same broker.
mqtt:
  broker: mosquitto:1883
  topic: evcc
  # user: wha                # set if you enable broker auth (recommended; evcc's key is 'user')
  # password: CHANGE_ME

site:
  title: Home
  meters:
    grid: sungrow_grid
    pv:
      - sungrow_pv
    battery:
      - sungrow_battery

loadpoints:
  - title: Garage
    charger: easee_home
    vehicle: twingo
    # Phase choice (the Easee Home itself is 3-phase capable):
    #   3 = fixed three-phase (example default). Predictable, but the minimum
    #       charge power is high: 8 A x 230 V x 3 = ~5.5 kW of export needed
    #       before evcc starts (the Twingo's real minimum is 8 A on 3 phases).
    #   1 = fixed single-phase. Starts at ~1.4-1.8 kW surplus (6-8 A x 230 V; 6 A
    #       only if your car allows it),
    #       best for small PV surplus; max ~3.7 kW (16 A). Needs the charger
    #       wired/configured for 1 phase.
    #   0 = auto: evcc switches 1p/3p itself. Phase switching on the Easee Home
    #       is supported; each switch writes the phase mode and then PAUSES the
    #       charger, and per the evcc docs it affects every charger on the same
    #       Easee circuit. Some cars react badly (red lamp, session aborts) —
    #       prefer a fixed value. With 0, wha's start floor counts ONE phase (start is
    #       single-phase); control.phases is not used once evcc has published
    #       phasesConfigured. Check `phasesActive` in MQTT.
    # NOTE: `phases:` in evcc.yaml is deprecated in favour of the loadpoint setting
    # in the evcc UI, but it still works.
    phases: 3
    # wha drives the mode between pv and off (it sends `pv`/`now`/`off`). evcc
    # >= 0.316 renamed `pv` to `smart` (minpv became the separate alwaysCharge
    # setting) and reports `smart` on the read topic; `mode/set` still accepts `pv`.
    mode: pv
    # A loadpoint-level `maxCurrent`/`minCurrent` key is undocumented on
    # docs.evcc.io; prefer wha's Max charge current setting or the evcc UI.
    # In `now` mode evcc writes the Easee dynamic current from its effective max
    # current (16 A by default), overriding temporary/dynamic app limits — only
    # the static "max charger current" set in the Easee app caps it.
    # evcc's own surplus gate. `threshold` is grid power in W (negative =
    # export). Enable: 0 means export must reach the minimum charge power (NOT
    # "as soon as any surplus exists"); a NEGATIVE value demands extra export on
    # top of that. Disable: only positive values act; 0 stops once surplus no
    # longer covers the minimum. Both delays run in parallel with wha's dwells.
    enable:
      delay: 1m # evcc default
      threshold: 0
    disable:
      delay: 3m # evcc default; protects the contactor from rapid cycling
      threshold: 0
    # Optional: how/when evcc polls the car for SoC. This lives on the LOADPOINT
    # `soc:` block (the vehicle-level key is `cache`). Default mode is `charging`
    # (Renault is only polled while charging, so SoC is an evcc estimate in
    # between). `connected` + a long interval gives fresher SoC while plugged in.
    # Car data is only reachable while the car is plugged in. Do NOT set
    # vehicle `onIdentify: mode` — it fights wha's mode control.
    # soc:
    #   poll:
    #     mode: connected # charging (default) | connected | always
    #     interval: 30m   # keep long: frequent polls hit Renault cloud rate limits
    #   estimate: true    # interpolate SoC between polls (evcc default)

# Sungrow SH8.0 RT hybrid via Modbus TCP (WiNet-S dongle, recent firmware).
# One device, three logical meters differing only by usage.
meters:
  - name: sungrow_grid
    type: template
    template: sungrow-hybrid
    usage: grid
    modbus: tcpip
    id: 1
    host: CHANGE_ME # inverter / WiNet-S IP address
    port: 502
  - name: sungrow_pv
    type: template
    template: sungrow-hybrid
    usage: pv
    modbus: tcpip
    id: 1
    host: CHANGE_ME
    port: 502
  - name: sungrow_battery
    type: template
    template: sungrow-hybrid
    usage: battery
    modbus: tcpip
    id: 1
    host: CHANGE_ME
    port: 502
    # Required by the current sungrow-hybrid template for usage: battery — evcc
    # refuses to start without them (older evcc docs call them optional). Set to
    # your battery's rated charge/discharge power in W. Live values are read from
    # input register 5627; 13051 is only the register evcc writes when it forces
    # battery charging/discharging. They only bound evcc's own battery control,
    # which wha doesn't use, so a conservative value is safe.
    maxchargepower: 5000 # W
    maxdischargepower: 5000 # W

chargers:
  - name: easee_home
    type: template
    template: easee
    user: CHANGE_ME # Easee account email
    password: CHANGE_ME # Easee account password
    charger: CHANGE_ME # charger serial, e.g. EH000000

vehicles:
  - name: twingo
    type: template
    template: renault
    title: Renault Twingo Electric
    capacity: 27.5 # usable kWh of the 2026 Twingo Electric (LFP) — verify for your car; too small overstates SoC, which stops early
    user: CHANGE_ME # MY Renault account email
    password: CHANGE_ME # MY Renault account password
    vin: CHANGE_ME # optional but recommended (starts with VF...)
    # minCurrent is the car's REAL minimum: the evcc Renault template documents
    # 8 A on 3 phases (10 A on older models) — keep it. If the Easee app caps the
    # charger at 8 A, evcc has exactly one possible current and cannot follow the
    # surplus. Fix: raise the Easee-app limit to your circuit rating (16 A) and
    # use wha's Max charge current setting for any temporary cap, or accept fixed
    # 8 A charging. (The Easee driver raises any start current below 7 A to 7 A.)
    # wha reads the effective value (effectiveMinCurrent) and floors its start
    # threshold accordingly; keep control.minCurrentA / control.phases in sync as
    # the fallback used until evcc has published its values.
    minCurrent: 8 # A — Twingo Electric minimum at 3 phases
    maxCurrent: 16 # A — set to your circuit/charger rating, never higher

tariffs:
  currency: EUR
  grid:
    type: fixed
    price: 0.29
  feedin:
    type: fixed
    price: 0.10
