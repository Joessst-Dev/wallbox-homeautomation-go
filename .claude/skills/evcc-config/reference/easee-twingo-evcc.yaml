## Example config: Easee Home wallbox + Renault Twingo Electric + Sungrow SH8.0 RT
## Fill in the CHANGE_ME values, then validate with: evcc -c evcc.yaml checkconfig
## Note: Renault Twingo Electric needs a minimum charging current of 8A at 3 phases.
## Note: the Sungrow SH-series hybrid provides grid, PV and battery from ONE Modbus
##       connection — three meters below share the same host/port.

# The Easee driver requires a sponsor token. https://sponsor.evcc.io — or the trial token
# at docs.evcc.io/en/sponsorship (currently expires 2026-11-23; verify before relying on it).
sponsortoken: CHANGE_ME

site:
  title: Home # display name for UI
  meters:
    grid: sungrow_grid # grid reading via the Sungrow smart meter
    pv:
      - sungrow_pv
    battery:
      - sungrow_battery

loadpoints:
  - title: Garage
    charger: easee_home
    vehicle: twingo
    # Phase choice (the Easee Home itself is 3-phase capable):
    #   3 = fixed three-phase (example default). Predictable, but the minimum
    #       charge power is high: 8 A x 230 V x 3 = ~5.5 kW of export needed
    #       before evcc starts (the Twingo's real minimum is 8 A on 3 phases).
    #   1 = fixed single-phase. Starts at ~1.4-1.8 kW surplus (6-8 A x 230 V; 6 A
    #       only if your car allows it),
    #       best for small PV surplus; max ~3.7 kW (16 A). Needs the charger
    #       wired/configured for 1 phase.
    #   0 = auto: evcc switches 1p/3p itself. Phase switching on the Easee Home is
    #       supported; each switch writes the phase mode and then PAUSES the charger,
    #       and per the evcc docs it affects every charger on the same Easee circuit.
    #       Some cars react badly (red lamp, session aborts) — prefer a fixed value.
    # NOTE: `phases:` in evcc.yaml is deprecated in favour of the loadpoint setting in
    # the evcc UI, but it still works.
    phases: 3
    # Modes: off | now | smart (evcc >= 0.316; older evcc: pv, plus minpv). evcc >= 0.316
    # replaced minpv with the separate alwaysCharge setting (off|on|once). `mode/set`
    # still accepts pv/minpv. Use "now" if you have no PV/tariff control.
    mode: pv
    # evcc only enables once export reaches the loadpoint's minimum charge power
    # (minCurrent x voltage x phases) — it is NOT "as soon as any surplus exists".
    # `threshold` is grid power in W (negative = export). Enable: 0 = export must reach
    # the minimum charge power; a NEGATIVE value demands extra export on top. Disable:
    # only positive values act; 0 stops once surplus no longer covers the minimum.
    # The delays (defaults: enable 1m, disable 3m) run in parallel with any external
    # controller's dwells (e.g. wha).
    # enable:
    #   delay: 1m
    #   threshold: 0
    # disable:
    #   delay: 3m
    #   threshold: 0
    # A loadpoint-level maxCurrent/minCurrent key is undocumented on docs.evcc.io; prefer
    # an external controller's max-current setting (wha) or the evcc UI. In `now` mode evcc
    # writes the Easee dynamic current from its effective max current (16 A default),
    # overriding temporary/dynamic app limits — only the static "max charger current" in
    # the Easee app caps it.
    # Optional SoC polling on the LOADPOINT `soc:` block (the vehicle-level key is `cache`).
    # Default mode: charging. Car data is only reachable while plugged in. Do NOT set
    # vehicle `onIdentify: mode` when an external controller (wha) owns the mode.
    # soc:
    #   poll:
    #     mode: connected # charging (default) | connected | always
    #     interval: 30m
    #   estimate: true

chargers:
  - name: easee_home
    type: template
    template: easee
    user: CHANGE_ME # Easee account email (same as the Easee app / portal)
    password: CHANGE_ME # Easee account password
    charger: CHANGE_ME # charger serial, e.g. EH000000

vehicles:
  - name: twingo
    type: template
    template: renault
    title: Renault Twingo Electric
    capacity: 27.5 # usable kWh of the 2026 Twingo Electric (LFP) — verify for your car; too small overstates SoC, which stops early
    user: CHANGE_ME # MY Renault account email
    password: CHANGE_ME # MY Renault account password
    vin: CHANGE_ME # optional but recommended: the car's VIN (starts with VF...)
    # minCurrent = the car's real minimum (Renault template: 8 A on 3 phases, 10 A on older
    # models) — keep it. If the Easee app caps the charger at 8 A, evcc has exactly one
    # possible current and cannot follow surplus: raise the app limit to the circuit rating
    # (16 A) and use a controller-side max-current setting for temporary caps, or accept
    # fixed 8 A charging. (The Easee driver raises start currents below 7 A to 7 A.)
    minCurrent: 8 # A — Twingo Electric minimum at 3 phases
    maxCurrent: 16 # A — circuit/charger rating, never higher

# Sungrow SH8.0 RT hybrid inverter via Modbus TCP (WiNet-S dongle, LAN/WiFi).
# One physical device, three logical meters that differ only by `usage`.
# Requires recent WiNet-S firmware; older firmware doesn't expose power/SoC.
meters:
  - name: sungrow_grid
    type: template
    template: sungrow-hybrid
    usage: grid
    modbus: tcpip
    id: 1 # Modbus slave id (Sungrow default is 1)
    host: CHANGE_ME # inverter / WiNet-S IP address
    port: 502 # Modbus TCP port (default 502)
  - name: sungrow_pv
    type: template
    template: sungrow-hybrid
    usage: pv
    modbus: tcpip
    id: 1
    host: CHANGE_ME # same IP as above
    port: 502
  - name: sungrow_battery
    type: template
    template: sungrow-hybrid
    usage: battery
    modbus: tcpip
    id: 1
    host: CHANGE_ME # same IP as above
    port: 502
    # Required by the current template for usage: battery (older docs call them optional).
    # Live values come from input register 5627; 13051 is only what evcc writes to force
    # battery charge/discharge.
    maxchargepower: 5000 # W — required for usage: battery, else evcc won't start
    maxdischargepower: 5000 # W — required for usage: battery

# Optional: enter your real tariff so pv/price-based modes work
tariffs:
  currency: EUR
  grid:
    type: fixed
    price: 0.29 # EUR/kWh
  feedin:
    type: fixed
    price: 0.10 # EUR/kWh
