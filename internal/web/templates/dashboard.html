<section class="space-y-4 sm:space-y-5">
  <!--
    Live status essentials: compact hero with state, surplus, and vehicle SoC.
    Polled every 5s; read-only so user input is never discarded by the poll.
  -->
  <div id="status"
       hx-get="/partials/status"
       hx-trigger="every 5s"
       hx-swap="innerHTML"
       hx-sync="this:replace">
    {{template "partials/status" .Status}}
  </div>

  <!--
    Operator controls sit directly under the hero so the Auto/Now/Stop override
    is reachable without scrolling past the detail cards. Polled slowly (60s) to
    pick up state changes from other sessions or restarts; actions (form submit,
    charge-power click) also refresh this block immediately via hx-target="#controls".
    The slow cadence means the 5s status poll never resets the user's in-progress
    input.
  -->
  <div id="controls"
       hx-get="/partials/controls"
       hx-trigger="every 60s"
       hx-swap="innerHTML"
       hx-sync="this:replace">
    {{template "partials/controls" .Status}}
  </div>

  <!--
    Secondary detail (power-flow breakdown + connection health), collapsed by
    default to keep the default view tidy. The <details> wrapper is static so its
    open/closed state survives the 5s poll; only the inner #detail data is swapped.
  -->
  <details class="group overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <summary class="flex min-h-[48px] cursor-pointer select-none list-none items-center justify-between px-4 py-3 text-sm font-semibold uppercase tracking-wide text-slate-500 transition hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-emerald-500 dark:text-slate-400 dark:hover:bg-slate-800 [&::-webkit-details-marker]:hidden">
      {{ t .Lang "status.detail_summary" }}
      <svg class="h-4 w-4 transition-transform group-open:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <div id="detail"
         hx-get="/partials/detail"
         hx-trigger="every 5s"
         hx-swap="innerHTML"
         hx-sync="this:replace"
         class="border-t border-slate-100 p-4 dark:border-slate-800 sm:p-5">
      {{template "partials/detail" .Status}}
    </div>
  </details>

  <!-- Recent sessions -->
  <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-5">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">{{ t .Sessions.Lang "session.recent_heading" }}</h2>
      <button type="button"
              class="rounded-lg px-2 py-1 text-xs font-medium text-slate-500 transition hover:bg-slate-100 hover:text-slate-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
              hx-get="/partials/sessions"
              hx-target="#sessions"
              hx-swap="innerHTML"
              aria-label="{{ t .Sessions.Lang "session.refresh" }}">
        {{ t .Sessions.Lang "session.refresh" }}
      </button>
    </div>
    <div id="sessions"
         hx-get="/partials/sessions"
         hx-trigger="load"
         hx-swap="innerHTML"
         aria-busy="true"
         aria-live="polite">
      {{template "partials/sessions" .Sessions}}
    </div>
  </section>
</section>
