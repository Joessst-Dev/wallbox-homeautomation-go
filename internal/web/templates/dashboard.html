<section class="space-y-4 sm:space-y-5">
  <!--
    Live status: hero, power flow, vehicle, health. Polled every 5s; read-only so
    user input is never discarded by the poll.
  -->
  <div id="status"
       hx-get="/partials/status"
       hx-trigger="every 5s"
       hx-swap="innerHTML"
       hx-sync="this:replace">
    {{template "partials/status" .Status}}
  </div>

  <!--
    Operator controls: charge-power toggle and override form. Polled slowly (60s)
    to pick up state changes from other sessions or restarts; actions (form submit,
    charge-power click) also refresh this block immediately via hx-target="#controls".
    The slow cadence means the 5s status poll never resets the user's in-progress
    input.
  -->
  <div id="controls"
       hx-get="/partials/controls"
       hx-trigger="every 60s"
       hx-swap="innerHTML"
       hx-sync="this:replace">
    {{template "partials/controls" .Status}}
  </div>

  <!-- Settings: auto-charge profile, software update, secure access -->
  <a href="/settings"
     class="flex items-center justify-between rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800">
    <span class="flex items-center gap-2">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
      {{ t .Lang "nav.settings_link" }}
    </span>
    <span aria-hidden="true">&rarr;</span>
  </a>

  <!-- Recent sessions -->
  <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-5">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">{{ t .Sessions.Lang "session.recent_heading" }}</h2>
      <button type="button"
              class="rounded-lg px-2 py-1 text-xs font-medium text-slate-500 transition hover:bg-slate-100 hover:text-slate-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
              hx-get="/partials/sessions"
              hx-target="#sessions"
              hx-swap="innerHTML"
              aria-label="{{ t .Sessions.Lang "session.refresh" }}">
        {{ t .Sessions.Lang "session.refresh" }}
      </button>
    </div>
    <div id="sessions"
         hx-get="/partials/sessions"
         hx-trigger="load"
         hx-swap="innerHTML"
         aria-busy="true"
         aria-live="polite">
      {{template "partials/sessions" .Sessions}}
    </div>
  </section>
</section>
