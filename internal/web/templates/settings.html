<section class="space-y-4 sm:space-y-5">
  <!--
    Software update: shows the running version and (when the updater sidecar is
    enabled) lets the operator check GHCR and apply a newer release. Polled
    slowly so an in-flight update's progress surfaces without spamming the
    handler; the check/apply actions target this same #update container.
  -->
  <div id="update"
       hx-get="/partials/update"
       hx-trigger="every 15s"
       hx-swap="innerHTML"
       hx-sync="this:replace">
    {{template "partials/update" .Update}}
  </div>

  <!-- Secure access / install-as-app entry point. -->
  <a href="/setup"
     class="flex items-center justify-between rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800">
    <span>{{ t .Lang "nav.setup_link" }}</span>
    <span aria-hidden="true">&rarr;</span>
  </a>
</section>
